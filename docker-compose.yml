services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hyvento
      POSTGRES_PASSWORD: hyvento
      POSTGRES_DB: hyvento
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  pgdata:
